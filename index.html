<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konversi Suhu</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="container">
    <h1>Konversi Suhu</h1>
    <div class="converter">
      <div id="celsiusGroup" class="input-group">
        <label for="celsius">Celsius (°C):</label>
        <input type="number" id="celsius" placeholder="Masukkan suhu dalam °C">
      </div>
      <div class="button-group">
        <button id="convert">Konversi</button>
        <button id="reset">Reset</button>
        <button id="reverse">Reverse</button>
      </div>
      <div id="fahrenheitGroup" class="input-group">
        <label for="fahrenheit">Fahrenheit (°F):</label>
        <input type="number" id="fahrenheit" placeholder="Hasil konversi dalam °F" readonly>
      </div>
    </div>
    <div class="explanation">
      <h2>Cara Kalkulasi:</h2>
      <p id="calculation"></p>
    </div>
    <div class="formula">
      <h2>Cara Konversi Dari Celsius (°C) ke Fahrenheit (°F)</h2>
      <p>Suhu <span class="special">S</span> dalam derajat Fahrenheit (°F) sama dengan suhu <span class="special">S</span> dalam derajat Celsius (°C) kali <span class="special">9/5</span> tambah <span class="special">32</span>.</p>
      <p><span class="special">S</span><span class="subscrip">(°F)</span> <span class="special">= (S</span><span class="subscrip">(°C)</span><span class="special"> X 9/5) + 32</span></p>
      <p>atau</p>
      <p><span class="special">S</span><span class="subscrip">(°F)</span> <span class="special">= (S</span><span class="subscrip">(°C)</span><span class="special"> X 1,8) + 32</span></p>
    </div>
  </div>

  <script src="JS/script.js"></script>
</body>
</html>
